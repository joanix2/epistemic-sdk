[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "epistemic-sdk"
version = "0.1.0"
description = "Typed epistemic interfaces and finite Boolean program discovery"
requires-python = ">=3.10"
dependencies = []
[project.scripts]
epistemic-demo = "epistemic.__main__:main"
[tool.setuptools.packages.find]
include = ["epistemic*"]

[dependency-groups]
dev = [
    "graphifyy>=0.9.91",
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
