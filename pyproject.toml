[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "epistemic-sdk"
dynamic = ["version"]
description = "Typed epistemic interfaces and finite Boolean program discovery"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
z3 = [
    "z3-solver>=5.3.0.0",
]

[tool.setuptools.packages.find]
include = ["epistemic*"]

[tool.setuptools.dynamic]
version = {attr = "epistemic_sdk.__version__"}

[dependency-groups]
dev = [
    "graphifyy>=0.9.91",
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
